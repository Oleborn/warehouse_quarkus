quarkus:
  http:
    port: 8080

  datasource:
    db-kind: postgresql

  liquibase:
    change-log: db/changelog.yaml
    migrate-at-start: true

  hibernate-orm:
    schema-management:
      strategy: none
    log:
      sql: true
      format-sql: true

"%dev":
  quarkus:
    datasource:
      jdbc:
        url: jdbc:postgresql://localhost:5432/mydb
      username: myuser
      password: mypassword